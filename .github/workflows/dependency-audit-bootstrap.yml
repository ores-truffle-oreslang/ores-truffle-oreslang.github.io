name: Inspect development dependency advisories

on:
  push:
    branches:
      - hardening/reproducible-ci-browser-evidence-20261014
    paths:
      - .github/workflows/dependency-audit-bootstrap.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
      - name: Install exact locked dependencies
        run: npm ci --no-fund
      - name: List advisory severity and affected packages
        run: |
          set -euo pipefail
          npm audit --json > /tmp/oreslang-npm-audit.json || true
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const a = JSON.parse(readFileSync("/tmp/oreslang-npm-audit.json", "utf8"));
          console.log("AUDIT_TOTAL " + JSON.stringify(a.metadata?.vulnerabilities));
          const items = Object.entries(a.vulnerabilities ?? {}).sort((x,y) => x[0].localeCompare(y[0]));
          for (const [name,v] of items) {
            if (v.severity !== "high" && v.severity !== "critical") continue;
            const via = v.via.map(x => typeof x === "string" ? x : x.name + ":" + x.title + ":" + x.range);
            console.log("AUDIT_HIGH " + JSON.stringify({name,severity:v.severity,range:v.range,isDirect:v.isDirect,via,fixAvailable:v.fixAvailable}));
          }
          NODE
      - name: Enforce clean production dependency surface
        run: npm audit --omit=dev --audit-level=high
