name: Seed reviewed cross-browser visual baselines

on:
  push:
    branches: [audit/log-evidence-visual-gates-20261014]
    paths:
      - ".github/workflows/visual-bootstrap.yml"

permissions:
  contents: read
  actions: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact site and pinned submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.20.0"
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Install Chromium image decoder
        run: npx playwright install --with-deps chromium
      - name: Download approved prior CI snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/oreslang-visual-seed
          gh run download 38661442077 --repo "${GITHUB_REPOSITORY}" --name browser-visual-review --dir /tmp/oreslang-visual-seed
          test "$(find /tmp/oreslang-visual-seed -name '*.png' | wc -l)" = 18
      - name: Generate reviewed snapshots' perceptual signatures
        run: node scripts/seed-visual-baselines.mjs /tmp/oreslang-visual-seed
