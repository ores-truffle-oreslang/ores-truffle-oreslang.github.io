name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site and pinned syntax highlighter
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify highlighter submodule is present
        run: |
          test -f vendor/html-js-css-syntax-highlighter/package.json
          git submodule status --recursive

      - name: Test syntax highlighter
        working-directory: vendor/html-js-css-syntax-highlighter
        run: npm run ci

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Run all marketing-site unit tests
        run: npm test

      - name: Parse log 007 SVGs and reject external references
        run: python3 tests/log7_svg_test.py

      - name: Build Astro site
        run: npm run build

      - name: Verify every generated engineering log and image asset
        run: |
          set -euo pipefail
          test -s dist/logs/index.html
          for n in 1 2 3 4 5 6 7; do
            test -s "dist/logs/$n/index.html"
            grep -qi "<h1" "dist/logs/$n/index.html"
            grep -q 'application/ld+json' "dist/logs/$n/index.html"
          done
          test -s dist/sitemap.xml
          for n in 1 2 3 4 5 6 7; do
            grep -q "https://ores-truffle-oreslang.github.io/logs/$n/" dist/sitemap.xml
          done
          test -s dist/logs/7/compiler-architecture.svg
          test -s dist/logs/7/incremental-invalidation.svg
          test -s dist/logs/7/wasm-profiles.svg
          grep -q "Five backends, one incremental compiler" dist/logs/7/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
