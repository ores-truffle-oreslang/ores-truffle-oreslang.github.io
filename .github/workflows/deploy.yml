name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout site and pinned syntax highlighter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify exact highlighter submodule gitlink
        run: |
          set -euo pipefail
          test -f vendor/html-js-css-syntax-highlighter/package.json
          expected="$(git ls-tree HEAD vendor/html-js-css-syntax-highlighter | awk '{print $3}')"
          actual="$(git -C vendor/html-js-css-syntax-highlighter rev-parse HEAD)"
          test -n "$expected" && test "$expected" = "$actual"
          git submodule status --recursive | tee /tmp/oreslang-submodules.txt
          if grep -Eq '^[+U-]' /tmp/oreslang-submodules.txt; then
            exit 1
          fi

      - name: Test syntax highlighter
        working-directory: vendor/html-js-css-syntax-highlighter
        run: npm run ci

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.20.0"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Audit production dependency advisories (high or critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies, including CI development tooling (high or critical)
        run: npm audit --audit-level=high

      - name: Run all marketing-site unit tests
        run: npm test

      - name: Parse log 007 SVGs and reject external references
        run: python3 tests/log7_svg_test.py

      - name: Build Astro site
        run: npm run build

      - name: Crawl all generated pages and verify internal links and fragments
        run: npm run test:site:build

      - name: Validate RSS feed and sitemap as XML
        run: npm run test:rss:build

      - name: Verify all published engineering logs and generated brand assets
        run: |
          set -euo pipefail
          npm run test:blogs:build
          test -s dist/brand/attolang-social.png
          test -s dist/brand/attolang-icon-180.png
          test -s dist/brand/attolang-black.png
          test -s dist/brand/attolang-white.png
          test -s dist/logs/7/compiler-architecture.svg
          test -s dist/logs/7/incremental-invalidation.svg
          test -s dist/logs/7/wasm-profiles.svg
          grep -q "Five backends, one incremental compiler" dist/logs/7/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Checkout verified live-site smoke checker
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Confirm public GitHub Pages deployment
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-live-pages.mjs; then
              exit 0
            fi
            echo "Pages verification attempt ${attempt} failed" >&2
            sleep 10
          done
          exit 1
