<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc">
<title id="title">Oreslang shared incremental compiler architecture</title>
<desc id="desc">Oreslang source flows through a shared semantic frontend into a query engine and persistent cache, branching to Java GraalVM, .NET, LLVM, Forge, and WebAssembly backends, and then into native or portable artifacts.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1921"/><stop offset="1" stop-color="#090d18"/></linearGradient><linearGradient id="core" x1="0" x2="1"><stop stop-color="#113b3a"/><stop offset="1" stop-color="#133047"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#89a8ba"/></marker></defs>
<rect width="1100" height="630" rx="20" fill="url(#bg)"/>
<g font-family="IBM Plex Sans,Arial,sans-serif"><text x="50" y="56" fill="#a9d8ce" font-size="17" font-weight="700" letter-spacing="3">ORESLANG / COMPILER ARCHITECTURE</text>
<text x="50" y="86" fill="#edf7f4" font-size="27" font-weight="700">One semantic engine. Multiple compilation targets.</text>
<rect x="346" y="114" width="408" height="62" rx="12" fill="#192a32" stroke="#729cac"/><text x="550" y="140" fill="#f0f7f9" font-size="20" font-weight="700" text-anchor="middle">Oreslang source</text><text x="550" y="160" fill="#b4c9d0" font-size="13" text-anchor="middle">files · modules · declarations · imports</text>
<path d="M550 176V209" fill="none" stroke="#89a8ba" stroke-width="2" marker-end="url(#arr)"/>
<rect x="166" y="217" width="768" height="113" rx="14" fill="url(#core)" stroke="#5ce4c0"/><text x="550" y="251" fill="#90f5dc" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="2">SHARED INCREMENTAL SEMANTIC CORE — PROPOSED</text><text x="550" y="280" fill="#f4f9fa" font-size="21" font-weight="600" text-anchor="middle">parse → typed HIR → types &amp; borrows → MIR → verify</text><text x="550" y="309" fill="#d2e5e8" font-size="15" text-anchor="middle">target-neutral declarations, effects, capabilities, semantic identities</text>
<path d="M550 330V357" fill="none" stroke="#89a8ba" stroke-width="2" marker-end="url(#arr)"/>
<rect x="206" y="364" width="688" height="69" rx="12" fill="#152944" stroke="#7dabeb"/><text x="550" y="390" fill="#b2d0ff" font-size="17" font-weight="800" text-anchor="middle">QUERY ENGINE + CONTENT-ADDRESSED CACHE</text><text x="550" y="414" fill="#e1eefa" font-size="15" text-anchor="middle">dependency graph · red/green validation · persistent verified results</text>
<path d="M550 433V457M122 457H978" fill="none" stroke="#89a8ba" stroke-width="2"/>
</g>
<g font-family="IBM Plex Sans,Arial,sans-serif" text-anchor="middle">
<g transform="translate(30,470)"><path d="M92 -13V0" stroke="#89a8ba" stroke-width="2"/><rect width="184" height="93" rx="11" fill="#17252e" stroke="#69868d"/><text x="92" y="37" fill="#f4f9fa" font-size="20" font-weight="700">Java</text><text x="92" y="61" fill="#bad1d4" font-size="14">GraalVM</text></g>
<g transform="translate(244,470)"><path d="M92 -13V0" stroke="#89a8ba" stroke-width="2"/><rect width="184" height="93" rx="11" fill="#17252e" stroke="#69868d"/><text x="92" y="37" fill="#f4f9fa" font-size="20" font-weight="700">.NET</text><text x="92" y="61" fill="#bad1d4" font-size="14">Native AOT</text></g>
<g transform="translate(458,470)"><path d="M92 -13V0" stroke="#89a8ba" stroke-width="2"/><rect width="184" height="93" rx="11" fill="#17252e" stroke="#69868d"/><text x="92" y="37" fill="#f4f9fa" font-size="20" font-weight="700">LLVM</text><text x="92" y="61" fill="#bad1d4" font-size="14">Native</text></g>
<g transform="translate(672,470)"><path d="M92 -13V0" stroke="#89a8ba" stroke-width="2"/><rect width="184" height="93" rx="11" fill="#17252e" stroke="#69868d"/><text x="92" y="37" fill="#f4f9fa" font-size="20" font-weight="700">Forge</text><text x="92" y="61" fill="#bad1d4" font-size="14">Experimental</text></g>
<g transform="translate(886,470)"><path d="M92 -13V0" stroke="#89a8ba" stroke-width="2"/><rect width="184" height="93" rx="11" fill="#17252e" stroke="#69868d"/><text x="92" y="37" fill="#f4f9fa" font-size="20" font-weight="700">Wasm</text><text x="92" y="61" fill="#bad1d4" font-size="14">Browser / WASI</text></g>
</g><text x="550" y="602" text-anchor="middle" fill="#9aafbd" font-family="IBM Plex Sans,Arial,sans-serif" font-size="14">Backend-specific legalization, code generation, runtime integration, and linking stay separate.</text>
</svg>