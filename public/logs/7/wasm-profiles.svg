<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Wasm deployment profiles for Oreslang</title><desc id="desc">A verified Wasm module branches into a browser or Web Worker embedding and a WASI server or edge embedding. Each host owns admission controls and runtime resource budgets.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9bb9c7"/></marker></defs><rect width="1100" height="360" rx="20" fill="#0b141e"/>
<g font-family="IBM Plex Sans,Arial,sans-serif"><text x="48" y="53" fill="#a9d8ce" font-size="17" letter-spacing="2" font-weight="700">WASM DEPLOYMENT PROFILES</text>
<rect x="362" y="77" width="376" height="62" rx="12" fill="#193345" stroke="#6ac8bf"/><text x="550" y="106" text-anchor="middle" fill="#f1faf8" font-size="21" font-weight="700">Verified Oreslang Wasm module</text><text x="550" y="126" text-anchor="middle" fill="#c7dcdf" font-size="14">Versioned runtime ABI + typed imports</text>
<path d="M550 139V159M272 159H827M272 159V180M827 159V180" fill="none" stroke="#9bb9c7" stroke-width="2" marker-end="url(#a)"/>
<rect x="54" y="190" width="435" height="115" rx="14" fill="#152b36" stroke="#699dc0"/><text x="272" y="220" text-anchor="middle" fill="#d6efff" font-weight="700" font-size="22">Browser / Web Workers</text><text x="272" y="244" text-anchor="middle" fill="#cedee8" font-size="16">Host-granted APIs and message transfer</text><text x="272" y="267" text-anchor="middle" fill="#cedee8" font-size="15">Memory, CPU and Worker termination limits</text><text x="272" y="290" text-anchor="middle" fill="#99bcc9" font-size="14">Browser embedding and sandbox policy</text>
<rect x="611" y="190" width="435" height="115" rx="14" fill="#17372f" stroke="#62cba5"/><text x="828" y="220" text-anchor="middle" fill="#ddffed" font-weight="700" font-size="22">WASI / server and edge</text><text x="828" y="244" text-anchor="middle" fill="#d2ece0" font-size="16">WIT component interfaces and host capabilities</text><text x="828" y="267" text-anchor="middle" fill="#d2ece0" font-size="15">Fuel, epochs and resource quotas where supported</text><text x="828" y="290" text-anchor="middle" fill="#a1d3b8" font-size="14">Explicit versioned WASI compatibility</text>
</g></svg>