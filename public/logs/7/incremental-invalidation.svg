<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 475" role="img" aria-labelledby="title desc">
<title id="title">Oreslang incremental rebuild decision graph</title>
<desc id="desc">A change to a function body invalidates its own code generation and possibly inlined callers, while a change to a public signature or inferred contract triggers semantic rechecking of dependent functions.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#95aebe"/></marker></defs>
<rect width="1100" height="475" rx="20" fill="#0b141e"/><g font-family="IBM Plex Sans,Arial,sans-serif">
<text x="44" y="56" fill="#a9d8ce" font-size="17" font-weight="700" letter-spacing="2">INCREMENTAL INVALIDATION</text><text x="44" y="88" fill="#f2f7f9" font-size="26" font-weight="700">Only recompute results whose dependencies changed</text>
<rect x="335" y="117" width="430" height="62" rx="11" fill="#193345" stroke="#86c6de"/><text x="550" y="145" font-size="20" font-weight="700" text-anchor="middle" fill="#f4fbff">A function changes</text><text x="550" y="166" font-size="14" text-anchor="middle" fill="#c0d8df">Compare old and new semantic fingerprints</text>
<path d="M550 179V206M275 206H825M275 206V231M825 206V231" stroke="#95aebe" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="50" y="239" width="450" height="93" rx="11" fill="#133c34" stroke="#63dfaa"/><text x="275" y="269" font-size="20" text-anchor="middle" fill="#d4ffec" font-weight="700">Body-only edit</text><text x="275" y="295" font-size="15" text-anchor="middle" fill="#d8efe5">Interface, effects, and contracts are unchanged</text><text x="275" y="316" font-size="14" text-anchor="middle" fill="#b4ddcb">Retain type checks of unaffected callers</text>
<rect x="600" y="239" width="450" height="93" rx="11" fill="#49311c" stroke="#f4b85f"/><text x="825" y="269" font-size="20" text-anchor="middle" fill="#fff1d3" font-weight="700">Contract edit</text><text x="825" y="295" font-size="15" text-anchor="middle" fill="#f9e0b8">Signature, effects, ownership, or capabilities change</text><text x="825" y="316" font-size="14" text-anchor="middle" fill="#f6d9a4">Recheck affected semantic dependents</text>
<path d="M275 332V357M825 332V357" stroke="#95aebe" stroke-width="2" marker-end="url(#a)"/>
<rect x="50" y="365" width="450" height="64" rx="11" fill="#1b2c34" stroke="#7197a7"/><text x="275" y="391" font-size="17" fill="#f0f7fa" font-weight="700" text-anchor="middle">Recompile this function</text><text x="275" y="414" font-size="14" fill="#c4d5dc" text-anchor="middle">and callers that embed its body (e.g., inlining)</text>
<rect x="600" y="365" width="450" height="64" rx="11" fill="#1b2c34" stroke="#7197a7"/><text x="825" y="391" font-size="17" fill="#f0f7fa" font-weight="700" text-anchor="middle">Propagate invalidation</text><text x="825" y="414" font-size="14" fill="#c4d5dc" text-anchor="middle">through actual declaration and codegen dependencies</text>
</g></svg>